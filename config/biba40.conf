# Biba40 config (ZMK 0.2.0)

# Core features
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y

# Power management
CONFIG_ZMK_SLEEP=y

# Mouse / Pointing support
CONFIG_ZMK_POINTING=y

# Logging (errors/warnings only)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth Stability Enhancements June 2026
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
# Force internal RC oscillator to bypass a missing or defective nice!nano hardware crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Calibrate the internal clock frequently to prevent Bluetooth timing drift
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
